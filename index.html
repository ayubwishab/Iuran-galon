<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kas Online | AR Developer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 10px; margin: 0; color: #333; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { text-align: center; color: #2c3e50; margin: 0; text-transform: uppercase; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
        
        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .db-card { background: #f8fafc; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #e2e8f0; }
        .db-card h4 { margin: 0; font-size: 11px; color: #64748b; }
        .db-card p { margin: 5px 0 0 0; font-size: 16px; font-weight: bold; }
        .text-green { color: #27ae60; } .text-red { color: #e74c3c; } .text-blue { color: #3498db; }

        /* Table */
        .table-responsive { overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
        th, td { border: 1px solid #e2e8f0; padding: 10px 5px; text-align: center; }
        th { background: #34495e; color: white; }
        .nama-col { text-align: left; background: #2c3e50; color: white; position: sticky; left: 0; font-weight: bold; min-width: 170px; z-index: 2; }
        
        .check-btn { cursor: pointer; font-size: 16px; background: none; border: none; padding: 0; }
        .lunas { color: #27ae60; font-weight: bold; } .belum { color: #e74c3c; }

        /* Admin & Overlay */
        .admin-panel { display: none; background: #f1f5f9; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px dashed #3498db; }
        input { padding: 10px; width: 100%; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { cursor: pointer; border-radius: 8px; font-weight: bold; border: none; padding: 12px; width: 100%; margin-top: 5px; transition: 0.3s; }
        .btn-pdf { background: #e67e22; color: white; margin-top: 15px; font-size: 14px; }
        .btn-login { background: #3498db; color: white; font-size: 11px; margin-top: 10px; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; }
        
        /* Area Laporan PDF (Teks Narasi) */
        #laporan-teks-area { 
            position: absolute; 
            left: -9999px; /* Tersembunyi tapi tetap renderable */
            top: 0;
            width: 800px;
            background: white;
            color: black;
        }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px;"></div>
    <b>🔄 Menghubungkan ke Database...</b>
</div>

<div class="container">
    <h2>Data Kas Sortir Online • 2026</h2>
    <div class="dashboard">
        <div class="db-card"><h4>Uang Masuk</h4><p class="text-green" id="txtMasuk">Rp 0</p></div>
        <div class="db-card"><h4>Uang Keluar</h4><p class="text-red" id="txtKeluar">Rp 0</p></div>
        <div class="db-card"><h4>Saldo Akhir</h4><p class="text-blue" id="txtSaldo">Rp 0</p></div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr><th class="nama-col">Nama Personil</th><th>Jan</th><th>Feb</th><th>Mar</th><th>Apr</th><th>Mei</th><th>Jun</th><th>Jul</th><th>Agu</th><th>Sep</th><th>Okt</th><th>Nov</th><th>Des</th></tr>
            </thead>
            <tbody id="tbodyIuran"></tbody>
        </table>
    </div>
</div>

<div id="laporan-teks-area">
    <div id="konten-narasi"></div>
</div>

<div class="container" style="background:transparent; box-shadow:none; padding-top:0;">
    <div class="admin-panel" id="formAdmin">
        <label><b>Menu Admin:</b></label>
        <input type="text" id="ketLog" placeholder="Keterangan (Donasi/Beli...)">
        <input type="number" id="nomLog" placeholder="Nominal Rp...">
        <button onclick="addLog('Donasi')" style="background:#27ae60; color:white;">+ Simpan Pemasukan Lain</button>
        <button onclick="addLog('Pengeluaran')" style="background:#e74c3c; color:white;">- Simpan Pengeluaran</button>
    </div>
    
    <button class="btn-pdf" onclick="eksporLaporanNarasi()">📄 DOWNLOAD LAPORAN RINGKAS (PDF TEKS)</button>
    <button id="loginBtn" class="btn-login" onclick="toggleAdmin()">🔓 MODE ADMIN</button>
    <div style="text-align:center; font-size:12px; color:#94a3b8; margin-top:20px;">Build By <strong>AR Developer • 2026</strong></div>
</div>

<script>
    // GANTI LINK DI BAWAH INI
    const webAppUrl = "https://script.google.com/macros/s/AKfycbxxf_BvawPZRk95OYSXg27N9EsDHVZKmZPONqF9Bhr2Fh-cvwjsj4rIF0JfRp7IkZ5Sfw/exec"; 
    
    const daftarBulan = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
    let dataIuran = [], dataLogs = [], isAdmin = false;

    async function fetchData() {
        showLoading(true);
        try {
            const res = await fetch(webAppUrl);
            const json = await res.json();
            dataIuran = json.personil;
            dataLogs = json.logs;
            render();
        } catch (e) { console.error(e); }
        showLoading(false);
    }

    function render() {
        const tbody = document.getElementById('tbodyIuran');
        tbody.innerHTML = '';
        let totalIuran = 0;

        dataIuran.forEach((p, idx) => {
            let row = `<tr><td class="nama-col">${idx + 1}. ${p.nama}</td>`;
            daftarBulan.forEach(bln => {
                if(p.bayar[bln]) totalIuran += 5000;
                row += `<td><button class="check-btn ${p.bayar[bln]?'lunas':'belum'}" onclick="toggleLunas('${p.nama}','${bln}',${p.bayar[bln]})" ${!isAdmin?'disabled':''}>${p.bayar[bln]?'✔':'✘'}</button></td>`;
            });
            tbody.innerHTML += row + `</tr>`;
        });

        const donasi = dataLogs.filter(l => l.tipe === 'Donasi').reduce((a,b) => a + b.jumlah, 0);
        const keluar = dataLogs.filter(l => l.tipe === 'Pengeluaran').reduce((a,b) => a + b.jumlah, 0);
        const masuk = totalIuran + donasi;

        document.getElementById('txtMasuk').innerText = "Rp " + masuk.toLocaleString();
        document.getElementById('txtKeluar').innerText = "Rp " + keluar.toLocaleString();
        document.getElementById('txtSaldo').innerText = "Rp " + (masuk - keluar).toLocaleString();
        document.getElementById('formAdmin').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('loginBtn').innerText = isAdmin ? "🔒 KELUAR MODE ADMIN" : "🔓 MODE ADMIN";
    }

    async function toggleLunas(nama, bulan, currentStatus) {
        showLoading(true);
        await fetch(webAppUrl, { method: 'POST', body: JSON.stringify({ action: 'updateIuran', nama, bulan, status: !currentStatus }) });
        await fetchData();
    }

    async function addLog(tipe) {
        const ket = document.getElementById('ketLog').value, jumlah = parseInt(document.getElementById('nomLog').value);
        if(ket && jumlah) {
            showLoading(true);
            await fetch(webAppUrl, { method: 'POST', body: JSON.stringify({ action: 'addLog', tipe, ket, jumlah }) });
            document.getElementById('ketLog').value = ''; document.getElementById('nomLog').value = '';
            await fetchData();
        }
    }

    function toggleAdmin() {
        if(!isAdmin && prompt("Password Admin:") === "epacantik77") isAdmin = true; else isAdmin = false;
        render();
    }

    function showLoading(show) { document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none'; }

    function eksporLaporanNarasi() {
        const area = document.getElementById('laporan-teks-area');
        const konten = document.getElementById('konten-narasi');
        const masuk = document.getElementById('txtMasuk').innerText;
        const keluar = document.getElementById('txtKeluar').innerText;
        const saldo = document.getElementById('txtSaldo').innerText;

        let narasiHTML = `
            <div style="padding: 40px; border: 3px solid #000; font-family: 'Courier New', monospace; background: white; color: black;">
                <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 25px;">
                    <h1 style="margin: 0; font-size: 24px;">LAPORAN KEUANGAN KAS SORTIR</h1>
                    <p style="margin: 5px 0;">Build By AR Developer • 2026</p>
                </div>

                <div style="margin-bottom: 30px;">
                    <p style="font-size: 18px; margin-bottom: 10px;"><b>RINGKASAN KAS:</b></p>
                    <table style="width: 100%; font-size: 16px;">
                        <tr><td style="width: 180px;">UANG MASUK</td><td>: <b>${masuk}</b></td></tr>
                        <tr><td>UANG KELUAR</td><td>: <b>${keluar}</b></td></tr>
                    </table>
                </div>

                <div style="margin-bottom: 30px;">
                    <p style="font-size: 18px; margin-bottom: 10px;"><b>RINCIAN PENGELUARAN:</b></p>
                    <ul style="font-size: 15px;">
                        ${dataLogs.filter(l => l.tipe === 'Pengeluaran').map(k => `<li>${k.ket}: Rp ${k.jumlah.toLocaleString()}</li>`).join('') || '<li>(Belum ada pengeluaran)</li>'}
                    </ul>
                </div>

                <div style="margin-top: 40px; border-top: 1px dashed #000; padding-top: 15px;">
                    <h2 style="margin: 0;">SALDO AKHIR: <span style="color: blue;">${saldo}</span></h2>
                </div>

                <p style="text-align: center; font-size: 11px; color: #666; margin-top: 100px;">
                    Laporan ini dihasilkan otomatis oleh Sistem Kas Online AR Developer.
                </p>
            </div>
        `;

        konten.innerHTML = narasiHTML;
        
        // Render ke PDF
        const opsi = {
            margin: 0.5,
            filename: 'Laporan_Kas_AR_Dev_2026.pdf',
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opsi).from(area).save();
    }

    // Animasi Loading CSS
    const style = document.createElement('style');
    style.innerHTML = `@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`;
    document.head.appendChild(style);

    fetchData();
</script>
</body>
</html>
