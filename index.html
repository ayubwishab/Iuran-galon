<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Iuran Sortir | Ar Developer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 10px; margin: 0; }
        .container { max-width: 900px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        
        /* Table Style */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 12px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: center; }
        th { background: #34495e; color: white; min-width: 60px; }
        th.nama-col { min-width: 120px; background: #2c3e50; sticky: left; }
        
        /* Status Warna */
        .check-btn { cursor: pointer; font-size: 18px; color: #ccc; transition: 0.2s; background: none; border: none; }
        .check-btn.lunas { color: #27ae60; }
        
        .card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .admin-only { display: none; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 5px; width: 100%; box-sizing: border-box; }
        button.primary { background: #27ae60; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        
        .footer-brand { text-align: center; margin-top: 30px; font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container" id="konten-laporan">
    <h2>Data Iuran Personil Sortir 2026</h2>
    
    <div class="table-responsive">
        <table id="tabelIuran">
            <thead>
                <tr>
                    <th class="nama-col">Nama Personil</th>
                    <th>Mei</th>
                    <th>Jun</th>
                    <th>Jul</th>
                    <th>Agu</th>
                    <th>Sep</th>
                    <th>Okt</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
</div>

<div class="container" style="background:transparent; box-shadow:none;">
    <div class="card admin-only" id="formAdmin">
        <h4>Panel Admin</h4>
        <input type="text" id="inputNama" placeholder="Nama personil baru...">
        <button class="primary" onclick="tambahPersonil()">+ Tambah Personil</button>
    </div>

    <button onclick="eksporPDF()" style="background:#e67e22; color:white; border:none; padding:12px; border-radius:5px; width:100%; font-weight:bold; margin-bottom:10px;">📄 Download Laporan PDF</button>
    <button id="loginBtn" onclick="toggleAdmin()" style="background:#3498db; color:white; border:none; padding:8px; border-radius:5px; width:100%; font-size:11px;">🔓 Mode Admin</button>
    
    <div class="footer-brand">
        Build By <strong>Ar Developer • 2026</strong>
    </div>
</div>

<script>
    let dataIuran = JSON.parse(localStorage.getItem('arDev_iuran_grid')) || [
        { nama: "Indah", bayar: { Mei: false, Jun: false, Jul: false, Agu: false, Sep: false, Okt: false } }
    ];
    let isAdmin = false;
    const daftarBulan = ["Mei", "Jun", "Jul", "Agu", "Sep", "Okt"];

    function updateTampilan() {
        document.getElementById('formAdmin').style.display = isAdmin ? 'block' : 'none';
        const tbody = document.querySelector('#tabelIuran tbody');
        tbody.innerHTML = '';

        dataIuran.forEach((personil, idx) => {
            let baris = `<tr><td style="text-align:left; font-weight:bold;">${personil.nama} 
                        ${isAdmin ? `<span onclick="hapusPersonil(${idx})" style="color:red; cursor:pointer; float:right;">x</span>` : ''}</td>`;
            
            daftarBulan.forEach(bulan => {
                const isLunas = personil.bayar[bulan];
                baris += `<td>
                            <button class="check-btn ${isLunas ? 'lunas' : ''}" 
                                    onclick="toggleLunas(${idx}, '${bulan}')" 
                                    ${!isAdmin ? 'disabled' : ''}>
                                ${isLunas ? '✔' : '✘'}
                            </button>
                          </td>`;
            });
            baris += '</tr>';
            tbody.innerHTML += baris;
        });
    }

    function toggleAdmin() {
        if(!isAdmin) {
            if(prompt("Password Admin:") === "epacantik77") isAdmin = true;
        } else { isAdmin = false; }
        updateTampilan();
    }

    function toggleLunas(personilIdx, bulan) {
        if(!isAdmin) return;
        dataIuran[personilIdx].bayar[bulan] = !dataIuran[personilIdx].bayar[bulan];
        simpanData();
    }

    function tambahPersonil() {
        const nama = document.getElementById('inputNama').value;
        if(nama) {
            let personilBaru = { 
                nama: nama, 
                bayar: { Mei: false, Jun: false, Jul: false, Agu: false, Sep: false, Okt: false } 
            };
            dataIuran.push(personilBaru);
            document.getElementById('inputNama').value = '';
            simpanData();
        }
    }

    function hapusPersonil(idx) {
        if(confirm("Hapus personil ini?")) {
            dataIuran.splice(idx, 1);
            simpanData();
        }
    }

    function simpanData() {
        localStorage.setItem('arDev_iuran_grid', JSON.stringify(dataIuran));
        updateTampilan();
    }

    function eksporPDF() {
        const element = document.getElementById('konten-laporan');
        html2pdf().from(element).set({
            margin: 0.3,
            filename: 'Laporan_Iuran_Sortir.pdf',
            html2canvas: { scale: 3 },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } // Landscape supaya muat banyak kolom
        }).save();
    }

    updateTampilan();
</script>
</body>
</html>
