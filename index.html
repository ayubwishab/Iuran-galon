<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kas Sortir | Ar Developer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 10px; margin: 0; color: #333; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { text-align: center; color: #2c3e50; margin: 0; text-transform: uppercase; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
        
        /* Dashboard Saldo */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; margin-bottom: 20px; }
        .db-card { background: #f8fafc; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #e2e8f0; }
        .db-card h4 { margin: 0; font-size: 11px; color: #64748b; text-transform: uppercase; }
        .db-card p { margin: 5px 0 0 0; font-size: 16px; font-weight: bold; }
        .text-green { color: #27ae60; }
        .text-red { color: #e74c3c; }
        .text-blue { color: #3498db; }

        /* Table Style */
        .table-responsive { overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
        th, td { border: 1px solid #e2e8f0; padding: 10px 5px; text-align: center; }
        th { background: #34495e; color: white; }
        .nama-col { text-align: left; background: #2c3e50; color: white; position: sticky; left: 0; z-index: 2; min-width: 170px; font-weight: bold; }
        
        /* Centang & Silang Warna */
        .check-btn { cursor: pointer; font-size: 16px; background: none; border: none; padding: 0; }
        .lunas { color: #27ae60; font-weight: bold; }
        .belum { color: #e74c3c; }
        
        /* Mencegah PDF Terpotong */
        tr { page-break-inside: avoid; page-break-after: auto; }

        /* Admin Panel */
        .admin-panel { display: none; margin-top: 15px; background: #f1f5f9; padding: 15px; border-radius: 10px; border: 1px dashed #3498db; }
        .form-section { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
        label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px; color: #34495e; }
        input { padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button { cursor: pointer; border-radius: 8px; font-weight: bold; border: none; transition: 0.3s; }
        .btn-add { background: #27ae60; color: white; padding: 10px; width: 100%; margin-bottom: 5px; }
        .btn-pdf { background: #e67e22; color: white; padding: 15px; width: 100%; margin-top: 10px; }
        .btn-login { background: #3498db; color: white; padding: 8px; width: 100%; margin-top: 10px; font-size: 11px; }
        
        .history-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .log-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 12px; }

        .footer-brand { text-align: center; margin-top: 20px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container" id="konten-laporan">
    <h2>Data Kas Personil Sortir • 2026</h2>
    
    <div class="dashboard">
        <div class="db-card"><h4>Total Pemasukan</h4><p class="text-green" id="txtMasuk">Rp 0</p></div>
        <div class="db-card"><h4>Total Pengeluaran</h4><p class="text-red" id="txtKeluar">Rp 0</p></div>
        <div class="db-card"><h4>Saldo Akhir</h4><p class="text-blue" id="txtSaldo">Rp 0</p></div>
    </div>

    <div class="table-responsive">
        <table id="tabelIuran">
            <thead>
                <tr>
                    <th class="nama-col">No. Nama Personil</th>
                    <th>Jan</th><th>Feb</th><th>Mar</th><th>Apr</th><th>Mei</th><th>Jun</th>
                    <th>Jul</th><th>Agu</th><th>Sep</th><th>Okt</th><th>Nov</th><th>Des</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="history-grid">
        <div>
            <h4 style="color:#27ae60; margin-bottom:10px;">Riwayat Pemasukan (Donasi):</h4>
            <div id="logMasuk"></div>
        </div>
        <div>
            <h4 style="color:#e74c3c; margin-bottom:10px;">Riwayat Pengeluaran:</h4>
            <div id="logKeluar"></div>
        </div>
    </div>
</div>

<div class="container" style="background:transparent; box-shadow:none; padding-top:0;">
    <div class="admin-panel" id="formAdmin">
        <div class="form-section">
            <label>INPUT PEMASUKAN LAIN (DONASI):</label>
            <input type="text" id="ketMasuk" placeholder="Nama penyumbang / keterangan...">
            <input type="number" id="nomMasuk" placeholder="Nominal Rp...">
            <button class="btn-add" onclick="tambahMasukLain()">Simpan Pemasukan</button>
        </div>
        <div class="form-section">
            <label>INPUT PENGELUARAN:</label>
            <input type="text" id="ketKeluar" placeholder="Beli apa...">
            <input type="number" id="nomKeluar" placeholder="Nominal Rp...">
            <button class="btn-add" style="background:#e74c3c" onclick="tambahPengeluaran()">Simpan Pengeluaran</button>
        </div>
        <div class="form-section">
            <label>KELOLA PERSONIL:</label>
            <input type="text" id="inputNama" placeholder="Nama personil baru...">
            <button class="btn-add" style="background:#34495e" onclick="tambahPersonil()">+ Tambah Nama</button>
        </div>
    </div>
    <button class="btn-pdf" onclick="eksporPDF()">📄 DOWNLOAD LAPORAN PDF LENGKAP</button>
    <button id="loginBtn" class="btn-login" onclick="toggleAdmin()">🔓 MODE ADMIN</button>
    <div class="footer-brand">Build By <strong>Ar Developer • 2026</strong></div>
</div>

<script>
    const daftarBulan = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
    const personilDefault = [
        "EVA CANTIK", "INDAH PUTRI SETIANI", "WULAN AGUSTIN", "ERLYNANDEA GEO SISKA", "FATIMATUZ ZACHRO",
        "ADIN ANGGRAINI", "DEWI AMINAH", "YUNIAR DWI", "RINA WULANDARI", "EILEN SABRINA", "ANGGI DWI PUSPITA",
        "ASKA NOVITA", "NAISHA ARIDHO", "ANDRIANI SAPUTRI", "ISTI PRASETNYANINGRUM", "KEISHA ANASTASYA",
        "CANTIKA MITAKHUL", "LIA LESTARI", "APRILIA", "FARIHATUL KAMILA", "ALIFATUZAHRO", "DIANI ARI WAHYUNI",
        "IDA ANUGRAH", "AMELIA DWI AGUSTINA", "DYAH AYU PERWITA", "SALMA ISNAINI", "DHINKA NOVIATANTI",
        "AMANDA EKA", "CATUR WAHYU", "KUSTANTI", "TIN TISNOWATI", "DIANIARI WAHYUNI"
    ];

    let dataIuran = JSON.parse(localStorage.getItem('arDev_kas_vFinal_2026'));
    if (!dataIuran) {
        dataIuran = personilDefault.map(n => {
            let sb = {};
            daftarBulan.forEach(b => sb[b] = ["Jan", "Feb", "Mar", "Apr"].includes(b));
            return { nama: n, bayar: sb };
        });
    }

    let dataKeluar = JSON.parse(localStorage.getItem('arDev_keluar_2026')) || [];
    let dataMasukLain = JSON.parse(localStorage.getItem('arDev_masukLain_2026')) || [];
    let isAdmin = false;

    function updateTampilan() {
        document.getElementById('formAdmin').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('loginBtn').innerText = isAdmin ? "🔒 KELUAR MODE ADMIN" : "🔓 MODE ADMIN";
        const tbody = document.querySelector('#tabelIuran tbody');
        tbody.innerHTML = '';
        let totalIuran = 0;

        dataIuran.forEach((p, idx) => {
            let row = `<tr><td class="nama-col">${idx + 1}. ${p.nama} ${isAdmin ? `<span style="color:#ff7675; cursor:pointer; font-size:8px; float:right" onclick="hapusPersonil(${idx})">[HAPUS]</span>` : ''}</td>`;
            daftarBulan.forEach(bln => {
                if(p.bayar[bln]) totalIuran += 5000;
                row += `<td><button class="check-btn ${p.bayar[bln] ? 'lunas' : 'belum'}" onclick="toggleLunas(${idx},'${bln}')" ${!isAdmin ? 'disabled' : ''}>${p.bayar[bln] ? '✔' : '✘'}</button></td>`;
            });
            tbody.innerHTML += row + `</tr>`;
        });

        let totalSumbangan = dataMasukLain.reduce((s, i) => s + i.jumlah, 0);
        let totalKeluar = dataKeluar.reduce((s, i) => s + i.jumlah, 0);
        let pemasukanFinal = totalIuran + totalSumbangan;

        document.getElementById('txtMasuk').innerText = "Rp " + pemasukanFinal.toLocaleString();
        document.getElementById('txtKeluar').innerText = "Rp " + totalKeluar.toLocaleString();
        document.getElementById('txtSaldo').innerText = "Rp " + (pemasukanFinal - totalKeluar).toLocaleString();

        renderLog('logMasuk', dataMasukLain, 'hapusMasuk', '#27ae60');
        renderLog('logKeluar', dataKeluar, 'hapusKeluar', '#e74c3c');
    }

    function renderLog(id, data, funcHapus, color) {
        const div = document.getElementById(id);
        div.innerHTML = data.length ? '' : '<span style="color:#999; font-size:11px">Belum ada data.</span>';
        data.forEach((m, i) => {
            div.innerHTML += `<div class="log-item"><span>${m.ket}</span> <b>Rp ${m.jumlah.toLocaleString()}</b> ${isAdmin ? `<span style="color:red; cursor:pointer" onclick="${funcHapus}(${i})"> (x)</span>` : ''}</div>`;
        });
    }

    function toggleAdmin() {
        if(!isAdmin && prompt("Password Admin:") === "epacantik77") isAdmin = true;
        else isAdmin = false;
        updateTampilan();
    }

    function toggleLunas(idx, bln) {
        dataIuran[idx].bayar[bln] = !dataIuran[idx].bayar[bln];
        simpan();
    }

    function tambahMasukLain() {
        const ket = document.getElementById('ketMasuk').value;
        const jml = parseInt(document.getElementById('nomMasuk').value);
        if(ket && jml) { dataMasukLain.push({ ket, jumlah: jml }); document.getElementById('ketMasuk').value = ''; document.getElementById('nomMasuk').value = ''; simpan(); }
    }

    function tambahPengeluaran() {
        const ket = document.getElementById('ketKeluar').value;
        const jml = parseInt(document.getElementById('nomKeluar').value);
        if(ket && jml) { dataKeluar.push({ ket, jumlah: jml }); document.getElementById('ketKeluar').value = ''; document.getElementById('nomKeluar').value = ''; simpan(); }
    }

    function tambahPersonil() {
        const n = document.getElementById('inputNama').value.toUpperCase();
        if(n) {
            let sb = {};
            daftarBulan.forEach(b => sb[b] = ["Jan", "Feb", "Mar", "Apr"].includes(b));
            dataIuran.push({ nama: n, bayar: sb });
            document.getElementById('inputNama').value = '';
            simpan();
        }
    }

    function hapusPersonil(i) { if(confirm("Hapus personil?")) { dataIuran.splice(i, 1); simpan(); } }
    function hapusKeluar(i) { if(confirm("Hapus pengeluaran?")) { dataKeluar.splice(i, 1); simpan(); } }
    function hapusMasuk(i) { if(confirm("Hapus donasi?")) { dataMasukLain.splice(i, 1); simpan(); } }

    function simpan() {
        localStorage.setItem('arDev_kas_vFinal_2026', JSON.stringify(dataIuran));
        localStorage.setItem('arDev_keluar_2026', JSON.stringify(dataKeluar));
        localStorage.setItem('arDev_masukLain_2026', JSON.stringify(dataMasukLain));
        updateTampilan();
    }

    function eksporPDF() {
        const el = document.getElementById('konten-laporan');
        const opsi = {
            margin: [0.5, 0.3],
            filename: 'Laporan_Kas_Sortir_2026.pdf',
            html2canvas: { scale: 2 },
            jsPDF: { orientation: 'landscape', unit: 'in', format: 'a4' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };
        html2pdf().set(opsi).from(el).save();
    }

    updateTampilan();
</script>
</body>
</html>
