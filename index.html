<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan Kas | Ar Developer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 15px; margin: 0; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { text-align: center; color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-top: 0; }
        
        /* Dashboard Keuangan */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .db-card { background: #ffffff; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #e1e8ed; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .db-card h4 { margin: 0; font-size: 11px; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; }
        .db-card p { margin: 8px 0 0 0; font-size: 18px; font-weight: bold; }
        .text-green { color: #27ae60; }
        .text-red { color: #e74c3c; }
        .text-blue { color: #3498db; }

        /* Tabel Responsive */
        .table-responsive { overflow-x: auto; border-radius: 10px; border: 1px solid #dee2e6; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
        th, td { border: 1px solid #dee2e6; padding: 12px 8px; text-align: center; }
        th { background: #34495e; color: white; font-weight: 500; }
        .nama-col { text-align: left; background: #2c3e50; color: white; position: sticky; left: 0; z-index: 2; font-weight: bold; min-width: 160px; }
        
        /* Simbol Centang/Silang */
        .check-btn { cursor: pointer; font-size: 18px; background: none; border: none; transition: transform 0.2s; }
        .lunas { color: #27ae60; font-weight: bold; }
        .belum { color: #e74c3c; }
        .check-btn:active { transform: scale(1.3); }

        /* Area Narasi Laporan */
        #laporanTeksArea { background: #ffffff; border: 2px solid #3498db; padding: 20px; border-radius: 10px; margin-top: 30px; }
        #laporanTeks { font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: #2c3e50; background: #f9f9f9; padding: 15px; border-radius: 5px; }

        /* Admin Controls */
        .admin-panel { display: none; margin-top: 20px; background: #ebf2f7; padding: 20px; border-radius: 12px; border: 1px dashed #3498db; }
        .admin-panel label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 13px; }
        input { padding: 12px; border: 1px solid #ccd6dd; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 12px; font-size: 14px; }
        button { cursor: pointer; border-radius: 8px; font-weight: bold; border: none; padding: 14px; width: 100%; transition: all 0.3s; margin-top: 5px; }
        .btn-add { background: #27ae60; color: white; }
        .btn-add:hover { background: #219150; }
        .btn-pdf { background: #e67e22; color: white; margin-top: 20px; box-shadow: 0 4px 6px rgba(230, 126, 34, 0.2); }
        .btn-login { background: #3498db; color: white; font-size: 12px; margin-top: 15px; opacity: 0.9; }
        
        .footer-text { text-align: center; margin-top: 25px; font-size: 12px; color: #95a5a6; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h2>Kas Sortir • <span id="labelBulanTahun">...</span></h2>
    
    <div class="dashboard">
        <div class="db-card"><h4>Uang Masuk (<span class="bln-label"></span>)</h4><p class="text-green" id="txtMasuk">Rp 0</p></div>
        <div class="db-card"><h4>Uang Keluar (<span class="bln-label"></span>)</h4><p class="text-red" id="txtKeluar">Rp 0</p></div>
        <div class="db-card"><h4>Saldo Akhir</h4><p class="text-blue" id="txtSaldo">Rp 0</p></div>
    </div>

    <div class="table-responsive">
        <table id="tabelIuran">
            <thead>
                <tr>
                    <th class="nama-col">Nama Personil</th>
                    <th>Jan</th><th>Feb</th><th>Mar</th><th>Apr</th><th>Mei</th><th>Jun</th>
                    <th>Jul</th><th>Agu</th><th>Sep</th><th>Okt</th><th>Nov</th><th>Des</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- AREA NARASI UNTUK PDF/WA -->
    <div id="laporanTeksArea">
        <h4 style="margin: 0 0 15px 0; color: #3498db; display: flex; align-items: center;">
            📄 Narasi Laporan Bulan <span class="bln-label" style="margin-left: 5px;"></span>
        </h4>
        <div id="laporanTeks">Mengumpulkan data...</div>
    </div>
</div>

<div class="container" style="background:transparent; box-shadow:none; padding-top:0;">
    <div class="admin-panel" id="formAdmin">
        <label>INPUT PENGELUARAN BULAN INI:</label>
        <input type="text" id="ketKeluar" placeholder="Contoh: Beli Galon & Gelas">
        <input type="number" id="nomKeluar" placeholder="Nominal Rp...">
        <button class="btn-add" style="background:#34495e" onclick="tambahPengeluaran()">SIMPAN PENGELUARAN</button>
    </div>
    
    <button class="btn-pdf" onclick="eksporPDF()">📄 DOWNLOAD LAPORAN NARASI (PDF)</button>
    <button id="loginBtn" class="btn-login" onclick="toggleAdmin()">🔓 MODE ADMIN</button>
    <div class="footer-text">Made by Rahman Erka • 2026</div>
</div>

<script>
    const daftarBulan = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
    const namaBulanIndo = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    
    const d = new Date();
    const bulanIndex = d.getMonth();
    const bulanSekarang = daftarBulan[bulanIndex];
    const namaBulanSekarang = namaBulanIndo[bulanIndex];
    const tahunSekarang = d.getFullYear();

    let dataIuran = JSON.parse(localStorage.getItem('arDev_sortir_v5')) || [];
    let dataKeluar = JSON.parse(localStorage.getItem('arDev_keluar_v5')) || [];
    let isAdmin = false;

    function updateTampilan() {
        document.getElementById('labelBulanTahun').innerText = `${namaBulanSekarang} ${tahunSekarang}`;
        document.querySelectorAll('.bln-label').forEach(el => el.innerText = namaBulanSekarang);
        document.getElementById('formAdmin').style.display = isAdmin ? 'block' : 'none';
        
        const tbody = document.querySelector('#tabelIuran tbody');
        tbody.innerHTML = '';
        
        let listLunas = [];
        let listBelum = [];
        let totalUangMasuk = 0;

        dataIuran.forEach((p, idx) => {
            let row = `<tr><td class="nama-col">${p.nama}</td>`;
            daftarBulan.forEach(bln => {
                const status = p.bayar[bln];
                // Hitung hanya untuk bulan berjalan
                if (bln === bulanSekarang) {
                    if (status) {
                        listLunas.push(p.nama);
                        totalUangMasuk += 5000;
                    } else {
                        listBelum.push(p.nama);
                    }
                }
                row += `<td><button class="check-btn ${status ? 'lunas' : 'belum'}" onclick="toggleLunas(${idx},'${bln}')" ${!isAdmin ? 'disabled' : ''}>${status ? '✔' : '✘'}</button></td>`;
            });
            tbody.innerHTML += row + `</tr>`;
        });

        // Filter pengeluaran spesifik bulan ini
        const rincianKeluar = dataKeluar.filter(k => k.bulan === bulanSekarang);
        const totalUangKeluar = rincianKeluar.reduce((a, b) => a + b.jumlah, 0);
        const saldoAkhir = totalUangMasuk - totalUangKeluar;

        document.getElementById('txtMasuk').innerText = `Rp ${totalUangMasuk.toLocaleString()}`;
        document.getElementById('txtKeluar').innerText = `Rp ${totalUangKeluar.toLocaleString()}`;
        document.getElementById('txtSaldo').innerText = `Rp ${saldoAkhir.toLocaleString()}`;

        // GENERATE NARASI LAPORAN
        let narasi = `LAPORAN KAS PERSONIL SORTIR\n`;
        narasi += `Periode: ${namaBulanSekarang.toUpperCase()} ${tahunSekarang}\n`;
        narasi += `------------------------------------------\n\n`;
        
        if (listBelum.length === 0) {
            narasi += `✅ STATUS PEMBAYARAN:\nSemua personil telah membayar iuran galon.\n\n`;
        } else {
            narasi += `⚠️ DAFTAR BELUM BAYAR (${listBelum.length} Orang):\n`;
            listBelum.forEach((nama, i) => narasi += `${i+1}. ${nama}\n`);
            narasi += `\n`;
        }

        narasi += `💰 RINGKASAN KEUANGAN BULAN INI:\n`;
        narasi += `- Total Uang Masuk  : Rp ${totalUangMasuk.toLocaleString()}\n`;
        narasi += `- Total Uang Keluar : Rp ${totalUangKeluar.toLocaleString()}\n`;
        narasi += `- Saldo Akhir       : Rp ${saldoAkhir.toLocaleString()}\n\n`;

        narasi += `💸 RINCIAN PENGELUARAN ${namaBulanSekarang.toUpperCase()}:\n`;
        if (rincianKeluar.length === 0) {
            narasi += `- (Belum ada catatan pengeluaran)\n`;
        } else {
            rincianKeluar.forEach(k => {
                narasi += `- ${k.ket}: Rp ${k.jumlah.toLocaleString()}\n`;
            });
        }

        narasi += `\n==========================================\n`;
        narasi += `Dibuat oleh: Made by Rahman Erka • 2026`;

        document.getElementById('laporanTeks').innerText = narasi;
    }

    function toggleAdmin() {
        if(!isAdmin && prompt("Masukkan Password Admin:") === "epacantik77") isAdmin = true;
        else isAdmin = false;
        updateTampilan();
    }

    function toggleLunas(idx, bln) {
        dataIuran[idx].bayar[bln] = !dataIuran[idx].bayar[bln];
        localStorage.setItem('arDev_sortir_v5', JSON.stringify(dataIuran));
        updateTampilan();
    }

    function tambahPengeluaran() {
        const ket = document.getElementById('ketKeluar').value;
        const jml = parseInt(document.getElementById('nomKeluar').value);
        if (ket && jml) {
            dataKeluar.push({ bulan: bulanSekarang, ket: ket, jumlah: jml });
            localStorage.setItem('arDev_keluar_v5', JSON.stringify(dataKeluar));
            document.getElementById('ketKeluar').value = '';
            document.getElementById('nomKeluar').value = '';
            updateTampilan();
        }
    }

    function eksporPDF() {
        const element = document.getElementById('laporanTeksArea');
        const opsi = {
            margin: 0.5,
            filename: `Laporan_Sortir_${namaBulanSekarang}_2026.pdf`,
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opsi).from(element).save();
    }

    // Inisialisasi Data Awal (Jan-Apr Lunas)
    if (dataIuran.length === 0) {
        const listNama = ["EVA CANTIK", "INDAH PUTRI SETIANI", "WULAN AGUSTIN", "ERLYNANDEA GEO SISKA", "FATIMATUZ ZACHRO", "ADIN ANGGRAINI", "DEWI AMINAH", "YUNIAR DWI", "RINA WULANDARI", "EILEN SABRINA", "ANGGI DWI PUSPITA", "ASKA NOVITA", "NAISHA ARIDHO", "ANDRIANI SAPUTRI", "ISTI PRASETNYANINGRUM", "KEISHA ANASTASYA", "CANTIKA MITAKHUL", "LIA LESTARI", "APRILIA", "FARIHATUL KAMILA", "ALIFATUZAHRO", "DIANI ARI WAHYUNI", "IDA ANUGRAH", "AMELIA DWI AGUSTINA", "DYAH AYU PERWITA", "SALMA ISNAINI", "DHINKA NOVIATANTI", "AMANDA EKA", "CATUR WAHYU", "KUSTANTI", "TIN TISNOWATI", "DIANIARI WAHYUNI"];
        dataIuran = listNama.map(nama => ({
            nama: nama,
            bayar: daftarBulan.reduce((acc, bln) => ({ ...acc, [bln]: ["Jan", "Feb", "Mar", "Apr"].includes(bln) }), {})
        }));
        localStorage.setItem('arDev_sortir_v5', JSON.stringify(dataIuran));
    }

    updateTampilan();
</script>
</body>
</html>
